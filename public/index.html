<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Busca de Imagens</title>
  <style>
    /* Reset básico */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #1e293b;
      color: #333;
      text-align: center; 
      padding: 20px; 
    }

    header {
      background: #0f172a;
      padding: 20px;
      border-radius: 10px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .search-box {
      margin-top: 10px;
    }

    input { 
      padding: 12px;
      width: 300px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    button { 
      padding: 12px 18px;
      margin-left: 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background: #1e293b;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #4972ff;
    }

    .galeria { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px; 
      justify-items: center; 
      margin-top: 20px; 
    }

    .img-box { 
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
      position: relative;
      width: 100%;
      max-width: 250px;
    }

    .img-box:hover {
      transform: scale(1.05);
    }

    .img-box img { 
      width: 100%; 
      display: block;
    }

    .img-box a { 
      display: block;
      text-align: center;
      background: #1e293b;
      color: white; 
      padding: 8px; 
      font-size: 14px; 
      text-decoration: none; 
      border-top: 1px solid #ddd;
      transition: 0.3s;
    }

    .img-box a:hover {
      background: #4972ff;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 Galeria Interativa</h1>
    <p>Pesquise imagens incríveis do <b>Pixabay</b> e <b>Unsplash</b></p>
    <div class="search-box">
      <input type="text" id="busca" placeholder="Ex: gatos, flores, cidades...">
      <button onclick="pesquisar()">🔍 Buscar</button>
    </div>
      <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V39CY0NKFK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-V39CY0NKFK');
</script>
  </header>

  <div class="galeria" id="galeria"></div>

  <footer>
    <p>Feito por Deby 🚀 | Powered by Pixabay & Unsplash APIs</p>
  </footer>

  <script>
  async function pesquisar() {
  const query = document.getElementById("busca").value.trim();

  if (!query) return;

  const galeria = document.getElementById("galeria");

  galeria.innerHTML = "<p>🔄 Carregando imagens...</p>";

  try {
    const response = await fetch(
      `/api/imagens?q=${encodeURIComponent(query)}`
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.erro || "Erro ao pesquisar.");
    }

    galeria.innerHTML = "";

    if (!data.imagens || data.imagens.length === 0) {
      galeria.innerHTML =
        "<p>❌ Nenhuma imagem encontrada.</p>";

      return;
    }

    data.imagens.forEach((img) => {
      const div = document.createElement("div");

      div.className = "img-box";

      div.innerHTML = `
        <img src="${img.src}" alt="${img.alt}">

        <p>${img.fonte}</p>

        <a
          href="${img.download}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ⬇️ Download
        </a>
      `;

      galeria.appendChild(div);
    });

  } catch (erro) {
    console.error("Erro:", erro);

    galeria.innerHTML =
      "<p>❌ Erro ao carregar imagens.</p>";
  }
}



async function carregarSugestoes() {
  const galeria = document.getElementById("galeria");

  galeria.innerHTML =
    "<p>🔄 Carregando sugestões...</p>";

  try {
    const response = await fetch("/api/sugestoes");

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.erro);
    }

    galeria.innerHTML = "";

    if (!data.imagens || data.imagens.length === 0) {
      galeria.innerHTML =
        "<p>❌ Nenhuma sugestão encontrada.</p>";

      return;
    }

    data.imagens.forEach((img) => {
      const div = document.createElement("div");

      div.className = "img-box";

      div.innerHTML = `
        <img src="${img.src}" alt="${img.alt}">

        <p>${img.fonte}</p>

        <a
          href="${img.download}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ⬇️ Download
        </a>
      `;

      galeria.appendChild(div);
    });

  } catch (erro) {
    console.error("Erro:", erro);

    galeria.innerHTML =
      "<p>❌ Erro ao carregar sugestões.</p>";
  }
}



document
  .getElementById("busca")
  .addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      pesquisar();
    }
  });


carregarSugestoes();
</script>
</body>
</html>
